name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      actions: read
      contents: write
      id-token: write
    # `platform` names the leg (the steps below branch on it); `runner` is the
    # Namespace profile it builds on (see ci.yml). The Linux profiles are Ubuntu
    # 22.04 so the packages keep that glibc baseline. There is no Windows
    # profile yet, so there is no Windows leg: Windows builds from source.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            runner: namespace-profile-oarlock-macos-arm64
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            runner: namespace-profile-oarlock-macos-arm64
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            runner: namespace-profile-oarlock-linux-amd64
            args: ""
            rust-target: ""
            appimage-arch: x86_64
          - platform: ubuntu-22.04-arm
            runner: namespace-profile-oarlock-linux-arm64
            args: ""
            rust-target: ""
            appimage-arch: aarch64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: |
            bun
            rust
          path: src-tauri/target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Write Apple API key to disk
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$KEY_CONTENT" > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      # The nested XPC bundle has its own entitlements and must be signed before
      # Tauri seals the enclosing app. Import the existing release identity for
      # the beforeBundleCommand; the action removes its temporary keychain later.
      - name: Import identity for the sandboxed Git helper
        if: startsWith(matrix.platform, 'macos')
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OARLOCK_CLI_TARGET: ${{ matrix.rust-target }}
          OARLOCK_DISTRIBUTION_BUILD: "1"

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Oarlock ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install."
          releaseDraft: true
          prerelease: false
          tauriScript: bun run tauri
          args: ${{ matrix.args }}

      - name: Verify packaged Git helper sandbox and signatures
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OARLOCK_RELEASE_TARGET: ${{ matrix.rust-target }}
        run: bun scripts/git-worker/verify-app.mjs "src-tauri/target/$OARLOCK_RELEASE_TARGET/release/bundle/macos"

      # Strip the bundled libwayland-* libs from the AppImage so it loads the
      # host copies at runtime. The Ubuntu 22.04 build host ships libwayland
      # 1.20, but recent Mesa (Fedora 43 / Arch / Bazzite, Mesa 1.22+) needs
      # newer symbols; AppImage puts its bundled libs first on the search path,
      # so the stale copy wins and EGL fails with EGL_BAD_PARAMETER. libgdk-3
      # hard-links these three, so removing them only redirects resolution to
      # the host copy, which every GTK-capable system has. They are on the
      # AppImage excludelist for this exact reason. The re-signed AppImage and
      # its .sig are re-uploaded here; the updater manifest is patched in the
      # patch-appimage-updater job after all matrix legs finish, so a parallel
      # macOS/Windows upload cannot clobber the combined latest.json.
      - name: Fix AppImage wayland libs and re-sign
        if: startsWith(matrix.platform, 'ubuntu') && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          echo "Patching: $APPIMAGE"

          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null

          test -x squashfs-root/usr/bin/oarlock \
            || { echo "oarlock binary missing from AppImage"; exit 1; }

          # linuxdeploy may already exclude some of these libraries.
          find squashfs-root \( -type f -o -type l \) \
            -name 'libwayland-*.so*' -print -delete

          ARCH="${{ matrix.appimage-arch }}"
          curl -fsSL -o appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${ARCH}.AppImage"
          chmod +x appimagetool.AppImage
          ARCH="$ARCH" ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"

          # Sanity-check the repacked image before it replaces the original.
          rm -rf squashfs-root
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          if find squashfs-root -name 'libwayland-*.so*' -print -quit | grep -q .; then
            echo "Wayland library still present after repack"
            exit 1
          fi
          test -x squashfs-root/usr/bin/oarlock \
            || { echo "oarlock binary missing from repacked AppImage"; exit 1; }
          popd >/dev/null

          cp "$WORK/$BASENAME" "$APPIMAGE"

          TAG="${GITHUB_REF_NAME}"
          rm -f "$APPIMAGE.sig"
          # The updater signature exists only while updates are on (a signing
          # key is configured); without one the repacked AppImage goes up alone.
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            bun run tauri signer sign "$APPIMAGE"
            gh release upload "$TAG" "$APPIMAGE" "$APPIMAGE.sig" \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release upload "$TAG" "$APPIMAGE" \
              --clobber --repo "$GITHUB_REPOSITORY"
          fi

  # Patch the re-signed AppImages into the combined updater manifest. Runs
  # once, after every matrix leg has finished merging its platform into
  # latest.json, so it operates on the full manifest and cannot be clobbered by
  # a parallel upload. Each platform key is patched only when its leg ran and
  # signed, and the job does nothing while updates are off and there is no
  # latest.json.
  patch-updater-manifest:
    needs: publish-tauri
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: namespace-profile-oarlock-linux-amd64
    permissions:
      contents: write
    steps:
      - name: Patch latest.json with the re-signed AppImage signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # latest.json exists only while updates are on (tauri-action writes
          # it when updater artifacts are built); nothing to patch otherwise.
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "latest.json" --clobber; then
            echo "No latest.json in $TAG: updates are off, nothing to patch."
            exit 0
          fi

          # Re-signing an artifact re-uploads it with --clobber, which deletes
          # and recreates the asset under a new id. tauri-action baked the old
          # asset-id API urls into latest.json, so the urls of re-signed
          # artifacts are rewritten to the stable tag+filename download url.
          # Each platform is patched only when its signature is in the release.
          patch() { # key file-glob
            local key="$1" glob="$2" sig file
            sig=$(ls $glob 2>/dev/null | head -n1) || true
            [ -n "$sig" ] || return 0
            file=$(basename "$sig" .sig)
            jq --arg key "$key" --arg s "$(cat "$sig")" --arg u "$DL/$file" '
              if .platforms[$key] then .platforms[$key] += {signature: $s, url: $u}
              else . end' latest.json > latest.json.tmp
            mv latest.json.tmp latest.json
          }

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            --pattern "*.AppImage.sig" || true

          patch linux-x86_64 "./*_amd64.AppImage.sig"
          patch linux-x86_64-appimage "./*_amd64.AppImage.sig"
          patch linux-aarch64 "./*_aarch64.AppImage.sig"
          patch linux-aarch64-appimage "./*_aarch64.AppImage.sig"

          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
