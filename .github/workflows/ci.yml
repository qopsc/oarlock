name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs run on Namespace runner profiles (cloud.namespace.so, Actions profiles),
# each with a cache volume attached:
#   oarlock-linux-amd64  Linux amd64, Ubuntu 22.04 (the release glibc baseline)
#   oarlock-macos-arm64  macOS arm64
# There is no Windows profile yet, so the Windows legs are left out until one
# exists. nscloud-cache-action keeps the Bun, Cargo, apt and target caches on
# that volume. Cargo's target dir is src-tauri/target, so it is listed
# explicitly.

jobs:
  frontend:
    runs-on: namespace-profile-oarlock-linux-amd64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: bun

      - run: bun install --frozen-lockfile

      - name: Audit (advisory)
        run: bun audit --prod --audit-level=high
        continue-on-error: true

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: React Compiler healthcheck (advisory)
        run: bun run react-compiler-healthcheck
        continue-on-error: true

      - name: Build frontend
        run: bun run build

      - name: Size budget
        run: bun run size

      - name: Dead code (advisory)
        run: bun run knip
        continue-on-error: true

  terminal-platforms:
    name: terminal-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: namespace-profile-oarlock-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: bun
      - run: bun install --frozen-lockfile
      - name: Terminal models, input, blocks, transport, and renderer lifecycle
        run: bun run vitest run src/modules/terminal

  rust:
    runs-on: namespace-profile-oarlock-linux-amd64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: apt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fish \
            zsh \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: src-tauri/target

      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest,cargo-machete

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unused crates (advisory)
        working-directory: src-tauri
        run: cargo machete
        continue-on-error: true

      - name: cargo nextest
        working-directory: src-tauri
        run: cargo nextest run --locked

      - name: fish shell integration
        run: fish --no-config src-tauri/src/modules/pty/scripts/init.test.fish

  rust-platforms:
    name: rust-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: namespace-profile-oarlock-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: src-tauri/target

      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo nextest
        working-directory: src-tauri
        run: cargo nextest run --locked --retries 2

      # keychain_compat (secrets.rs) writes real Keychain / Credential Manager
      # items. A throwaway, unlocked default keychain keeps it from depending
      # on (or prompting for) the runner's login keychain.
      - name: Prepare a test keychain
        if: matrix.os == 'macos'
        run: |
          security create-keychain -p oarlock-ci oarlock-ci.keychain-db
          security set-keychain-settings oarlock-ci.keychain-db
          security unlock-keychain -p oarlock-ci oarlock-ci.keychain-db
          security list-keychains -d user -s oarlock-ci.keychain-db $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s oarlock-ci.keychain-db

      - name: Saved keys stay readable (keychain_compat)
        working-directory: src-tauri
        run: cargo nextest run --locked --run-ignored only -E 'test(keychain_compat)'

  coverage:
    runs-on: namespace-profile-oarlock-linux-amd64
    needs: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: apt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: src-tauri/target

      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Generate coverage
        working-directory: src-tauri
        run: cargo llvm-cov nextest --locked --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov-report
          path: src-tauri/lcov.info
          if-no-files-found: error
